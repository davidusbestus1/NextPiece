<body>

<header>

<div class="logo">

<img src="Logo1.png">

<h1>NextPiece</h1>

</div>

</header>







<div class="container">


<h2 id="welcome"></h2>

<h2>⭐ Today's Pick</h2>

<div class="result" id="todaysPick">

<p>Loading today's pick...</p>

</div>

<hr>

<h2>Your Personalized Recommendations 🎯</h2>


<div class="result" id="recommended">

<p>Your recommendations will appear here.</p>

</div>



</div>








<script src="songs-with-spotify.js"></script>

<script src="script.js"></script>




<script>


const user = JSON.parse(localStorage.getItem("user"));



if(!user){

    window.location.href="login.html";

}

else{

    document.getElementById("welcome").textContent =
    "Welcome back, " + user.name + " 🎵";

}






function logout(){

    localStorage.removeItem("user");

    window.location.href="login.html";

}






showRecommendations();
showTodaysPick();

   const transition = document.querySelector(".transition");


    document.querySelectorAll("a").forEach(link => {

        if(link.href.includes(".html")){

            link.addEventListener("click", function(e){

                e.preventDefault();

                let destination = this.href;

                transition.classList.add("active");


                setTimeout(() => {

                    window.location.href = destination;

                }, 500);

            });

        }

    });

    function shareApp(){

    const shareData = {
        title: "NextPiece 🎵",
        text: "Find your next piece with NextPiece!",
        url: window.location.href
    };


    if(navigator.share){

        navigator.share(shareData);

    }

    else{

        navigator.clipboard.writeText(window.location.href);

        alert("Link copied! Send it to your friends 🎵");

    }

}

function shareApp(){

    const shareData = {
        title: "NextPiece 🎵",
        text: "Find your next piece with NextPiece!",
        url: window.location.href
    };


    if(navigator.share){

        navigator.share(shareData);

    }

    else{

        navigator.clipboard.writeText(window.location.href);

        alert("Link copied! Send it to your friends 🎵");

    }

}



</script>
